spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/alibi
          jwk-set-uri: http://localhost:8081/realms/alibi/protocol/openid-connect/certs
  datasource:
    url: jdbc:postgresql://localhost:5432/alibi
    username: alibi
    password: alibi

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: info
    cz.tomas.alibi: debug
    # org.hibernate.SQL: debug
    # org.hibernate.orm.jdbc.bind: trace

