openapi: 3.0.3
info:
  title: Alibi API
  version: 1.0.0
  description: REST API for operation planning, crew management, people, and equipment.
servers:
  - url: /
    description: Current server
tags:
  - name: People
  - name: Items
  - name: Operations
paths:
  /api/person:
    get:
      tags: [People]
      summary: List people
      description: Returns all crew profiles. Requires the CREW_MANAGER or ADMIN role.
      operationId: getAllPersons
      responses:
        '200':
          description: Crew profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [People]
      summary: Create a person
      description: Creates a crew profile. Requires the ADMIN role.
      operationId: createPerson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonRequest'
      responses:
        '200':
          description: Created crew profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/person/{personId}:
    get:
      tags: [People]
      summary: Get a person
      description: Returns one crew profile. Requires the CREW_MANAGER or ADMIN role.
      operationId: getPerson
      parameters:
        - $ref: '#/components/parameters/PersonId'
      responses:
        '200':
          description: Crew profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/item:
    get:
      tags: [Items]
      summary: List items
      description: Returns a pageable, optionally category-filtered list. This endpoint is public.
      operationId: getItems
      security: []
      parameters:
        - name: category
          in: query
          required: false
          description: Restrict results to one item category.
          schema:
            $ref: '#/components/schemas/ItemCategory'
        - name: page
          in: query
          required: false
          description: Zero-based page index.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Number of results per page.
          schema:
            type: integer
            minimum: 1
            default: 20
        - name: sort
          in: query
          required: false
          description: Sort expression in `property,direction` form. May be repeated.
          schema:
            type: array
            items:
              type: string
            default: [label,asc]
          style: form
          explode: true
      responses:
        '200':
          description: Page of items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemPage'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Items]
      summary: Create an item
      description: Creates an equipment item. Requires the ADMIN role.
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'
      responses:
        '200':
          description: Created item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/operation:
    get:
      tags: [Operations]
      summary: List operations
      description: Returns operation summaries. Requires the CREW_MANAGER or ADMIN role.
      operationId: getAllOperations
      responses:
        '200':
          description: Operation summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OperationSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Operations]
      summary: Create an operation
      description: Creates an operation. Requires the CREW_MANAGER role.
      operationId: createOperation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOperationRequest'
      responses:
        '200':
          description: Created operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/operation/{operationId}:
    get:
      tags: [Operations]
      summary: Get an operation
      description: Returns an operation and its crew. Requires the CREW_MANAGER or ADMIN role.
      operationId: getOperation
      parameters:
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: Operation detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/operation/{operationId}/crew-member:
    post:
      tags: [Operations]
      summary: Add an operation crew member
      description: Assigns an existing person to an operation. Requires the CREW_MANAGER role.
      operationId: addCrewMember
      parameters:
        - $ref: '#/components/parameters/OperationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCrewMemberRequest'
      responses:
        '200':
          description: Updated operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/operation/{operationId}/crew-member/{personId}:
    delete:
      tags: [Operations]
      summary: Remove an operation crew member
      description: Removes a person's assignment from an operation. Requires the CREW_MANAGER role.
      operationId: removeCrewMember
      parameters:
        - $ref: '#/components/parameters/OperationId'
        - $ref: '#/components/parameters/PersonId'
      responses:
        '200':
          description: Updated operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token carrying the required realm role.
  parameters:
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Request validation or parsing failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: A valid bearer token was not supplied.
    Forbidden:
      description: The authenticated user does not have the required role.
    NotFound:
      description: The requested resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: The requested crew change violates a domain rule.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    CreatePersonRequest:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
          minLength: 1
          example: Jane Doe
        phone:
          type: string
          minLength: 1
          description: Required phone number; whitespace is removed before persistence.
          example: '+420 736 123 456'
    PersonSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Jane Doe
    PersonDetail:
      allOf:
        - $ref: '#/components/schemas/PersonSummary'
        - type: object
          required: [phone, operationCodeNames]
          properties:
            phone:
              type: string
              example: '+420736123456'
            operationCodeNames:
              type: array
              items:
                type: string
              example: [Operation Harambe]
    CreateItemRequest:
      type: object
      required: [label, category]
      properties:
        label:
          type: string
          minLength: 1
          example: Radio
        category:
          $ref: '#/components/schemas/ItemCategory'
    Item:
      type: object
      required: [id, label, category]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          example: Radio
        category:
          $ref: '#/components/schemas/ItemCategory'
    ItemCategory:
      type: string
      enum: [VEHICLE, TOOL, WEARABLE, OTHER]
    ItemPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 0
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    CreateOperationRequest:
      type: object
      required: [codeName]
      properties:
        codeName:
          type: string
          minLength: 1
          example: Operation Harambe
        crewSizeLimit:
          type: integer
          minimum: 1
          nullable: true
          description: Optional maximum number of assigned crew members.
          example: 5
    OperationSummary:
      type: object
      required: [id, codeName, crewSize]
      properties:
        id:
          type: string
          format: uuid
        codeName:
          type: string
          example: Operation Harambe
        crewSize:
          type: integer
          minimum: 0
          example: 2
        crewSizeLimit:
          type: integer
          minimum: 1
          nullable: true
          example: 5
    OperationDetail:
      type: object
      required: [id, codeName, crewMembers]
      properties:
        id:
          type: string
          format: uuid
        codeName:
          type: string
          example: Operation Harambe
        crewSizeLimit:
          type: integer
          minimum: 1
          nullable: true
          example: 5
        crewMembers:
          type: array
          items:
            $ref: '#/components/schemas/PersonSummary'
    AddCrewMemberRequest:
      type: object
      required: [personId]
      properties:
        personId:
          type: string
          format: uuid
    ProblemDetail:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
          example: about:blank
        title:
          type: string
          example: Request validation failed
        status:
          type: integer
          format: int32
          example: 400
        detail:
          type: string
          example: One or more request fields are invalid.
        instance:
          type: string
          format: uri
          example: /api/person
        errors:
          type: object
          additionalProperties:
            type: string
          description: Field errors included for validation failures.
security:
  - bearerAuth: []
